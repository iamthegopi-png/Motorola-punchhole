name: Build Moto Edge 60 Pro Companion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -alias companion_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Edge60Pro2026 -keypass Edge60Pro2026 \
            -dname "CN=MotoStudioCompanion, OU=Mobile, O=EdgeStudio, L=Mumbai, S=MH, C=IN"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Signed Release APK
        run: gradle assembleRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Moto-Edge60Pro-PunchCompanion-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          
